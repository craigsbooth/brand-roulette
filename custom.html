<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Roulette - Custom Wheel Builder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff8dc 0%, #ffd700 40%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-btn {
            padding: 10px 24px;
            background: linear-gradient(180deg, #ff4d4d 0%, #c0392b 50%, #8b0000 100%);
            border: 2px solid #ffd700;
            border-radius: 30px;
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .back-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,215,0,0.5); }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border-radius: 30px;
            border: 2px solid rgba(255,215,0,0.4);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus { border-color: #ffd700; }
        .search-box::placeholder { color: #888; }

        .filter-select {
            padding: 12px 20px;
            border-radius: 30px;
            border: 2px solid rgba(255,215,0,0.4);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffd700' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 40px;
        }

        .filter-select option { background: #1a1a2e; color: #fff; }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .stat {
            padding: 8px 16px;
            background: rgba(255,215,0,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 20px;
            font-size: 0.85rem;
            color: #ffd700;
            font-weight: 600;
        }

        .clear-btn {
            padding: 8px 16px;
            background: rgba(233,69,96,0.2);
            border: 1px solid rgba(233,69,96,0.5);
            border-radius: 20px;
            color: #e94560;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover { background: rgba(233,69,96,0.4); }

        .brand-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            padding: 10px 5px;
        }

        .brand-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .brand-card:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,215,0,0.3);
        }

        .brand-card.selected {
            background: rgba(255,215,0,0.1);
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255,215,0,0.2);
        }

        .brand-card .logo-thumb {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: #fff;
            padding: 3px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .brand-card .brand-info {
            overflow: hidden;
        }

        .brand-card .brand-info .name {
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-card .brand-info .cat {
            font-size: 0.65rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .brand-card .check {
            margin-left: auto;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .brand-card.selected .check {
            border-color: #ffd700;
            background: #ffd700;
        }

        .brand-card.selected .check::after {
            content: '✓';
            color: #1a1a2e;
            font-size: 0.7rem;
            font-weight: 900;
        }

        /* Scrollbar */
        .brand-grid::-webkit-scrollbar { width: 8px; }
        .brand-grid::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 4px; }
        .brand-grid::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.3); border-radius: 4px; }
        .brand-grid::-webkit-scrollbar-thumb:hover { background: rgba(255,215,0,0.5); }

        .alpha-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 12px;
        }

        .alpha-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid rgba(255,215,0,0.3);
            background: rgba(255,255,255,0.05);
            color: #ccc;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .alpha-btn:hover { background: rgba(255,215,0,0.15); color: #fff; }
        .alpha-btn.active { background: #ffd700; color: #1a1a2e; border-color: #ffd700; }

        .pagination {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin: 10px 0;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255,215,0,0.3);
            background: rgba(255,255,255,0.05);
            color: #ccc;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .page-btn:hover { background: rgba(255,215,0,0.15); color: #fff; }
        .page-btn.active { background: #ffd700; color: #1a1a2e; border-color: #ffd700; }
    </style>
</head>
<body>
    <div class="header">
        <h1>CUSTOM WHEEL</h1>
        <a href="index.html" class="back-btn">← Back to Spin</a>
    </div>

    <div class="controls">
        <input type="text" class="search-box" id="searchBox" placeholder="Search brands...">
        <select class="filter-select" id="filterCat">
            <option value="">All Categories</option>
        </select>
    </div>

    <div class="alpha-bar" id="alphaBar"></div>

    <div class="stats-bar">
        <div class="stat" id="selectedCount">0 selected</div>
        <div class="stat" id="totalShown">0 shown</div>
        <button class="clear-btn" onclick="clearAll()">Clear Selection</button>
    </div>

    <div class="pagination" id="pagination"></div>
    <div class="brand-grid" id="brandGrid"></div>
    <div class="pagination" id="paginationBottom"></div>

    <script src="brands.js"></script>
    <script>
        const STORAGE_KEY = 'brandRoulette_customWheel';
        const PAGE_SIZE = 50;
        let selectedBrands = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
        let currentLetter = 'A';
        let currentPage = 1;
        let currentSearch = '';
        let currentCat = '';

        // Sort brands alphabetically
        ALL_BRANDS.sort((a, b) => a.name.localeCompare(b.name));

        // Get unique categories
        const categories = [...new Set(ALL_BRANDS.map(b => b.category))].sort();

        // Populate category filter
        const filterCat = document.getElementById('filterCat');
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            filterCat.appendChild(opt);
        });

        // Build alphabet bar
        const alphaBar = document.getElementById('alphaBar');
        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
        letters.forEach(letter => {
            const btn = document.createElement('button');
            btn.className = 'alpha-btn' + (letter === 'A' ? ' active' : '');
            btn.textContent = letter;
            btn.onclick = () => {
                currentLetter = letter;
                currentPage = 1;
                currentSearch = '';
                document.getElementById('searchBox').value = '';
                document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderBrands();
            };
            alphaBar.appendChild(btn);
        });

        function getFilteredBrands() {
            let filtered = ALL_BRANDS;

            if (currentSearch) {
                filtered = filtered.filter(b => b.name.toLowerCase().includes(currentSearch));
            } else if (currentLetter === '#') {
                filtered = filtered.filter(b => !/^[A-Za-z]/.test(b.name));
            } else {
                filtered = filtered.filter(b => b.name.toUpperCase().startsWith(currentLetter));
            }

            if (currentCat) {
                filtered = filtered.filter(b => b.category === currentCat);
            }

            return filtered;
        }

        function renderBrands() {
            const filtered = getFilteredBrands();
            const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
            if (currentPage > totalPages) currentPage = 1;

            const start = (currentPage - 1) * PAGE_SIZE;
            const pageItems = filtered.slice(start, start + PAGE_SIZE);

            const grid = document.getElementById('brandGrid');
            grid.innerHTML = pageItems.map(brand => {
                const isSelected = selectedBrands.has(brand.name);
                const safeName = brand.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                return `
                    <div class="brand-card ${isSelected ? 'selected' : ''}" onclick="toggleBrand('${safeName}')">
                        <img class="logo-thumb" src="${brand.logoUrl}" loading="lazy" alt="" onerror="this.style.display='none'">
                        <div class="brand-info">
                            <div class="name">${brand.name}</div>
                            <div class="cat">${brand.category}</div>
                        </div>
                        <div class="check"></div>
                    </div>
                `;
            }).join('');

            // Pagination
            renderPagination(totalPages);

            document.getElementById('totalShown').textContent = filtered.length + ' found';
            document.getElementById('selectedCount').textContent = selectedBrands.size + ' selected';
        }

        function renderPagination(totalPages) {
            const html = Array.from({length: totalPages}, (_, i) => {
                const p = i + 1;
                return `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
            }).join('');
            document.getElementById('pagination').innerHTML = html;
            document.getElementById('paginationBottom').innerHTML = html;
        }

        function goToPage(p) {
            currentPage = p;
            renderBrands();
            document.getElementById('brandGrid').scrollIntoView({behavior: 'smooth'});
        }

        function toggleBrand(name) {
            if (selectedBrands.has(name)) {
                selectedBrands.delete(name);
            } else {
                selectedBrands.add(name);
            }
            save();
            // Just update the clicked card without re-rendering everything
            const cards = document.querySelectorAll('.brand-card');
            cards.forEach(card => {
                const cardName = card.querySelector('.name')?.textContent;
                if (cardName === name) {
                    card.classList.toggle('selected');
                }
            });
            document.getElementById('selectedCount').textContent = selectedBrands.size + ' selected';
        }

        function clearAll() {
            selectedBrands.clear();
            save();
            renderBrands();
        }

        function save() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify([...selectedBrands]));
        }

        // Event listeners
        let searchTimeout;
        document.getElementById('searchBox').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentSearch = e.target.value.toLowerCase();
                currentPage = 1;
                // Deactivate letter buttons when searching
                if (currentSearch) {
                    document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
                }
                renderBrands();
            }, 300);
        });

        document.getElementById('filterCat').addEventListener('change', (e) => {
            currentCat = e.target.value;
            currentPage = 1;
            renderBrands();
        });

        // Initial render - start at letter A
        renderBrands();
    </script>
</body>
</html>
