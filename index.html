<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Roulette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow-x: hidden;
            padding: 10px;
        }

        h1 {
            font-size: 2.4rem;
            margin: 10px 0 8px 0;
            text-align: center;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff8dc 0%, #ffd700 40%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .wheel-count-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .wheel-count-label {
            font-size: 0.8rem;
            color: #aaa;
            letter-spacing: 3px;
            font-weight: 700;
        }

        .wheel-count-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            background: rgba(255,255,255,0.05);
            color: #ffd700;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .wheel-count-btn:hover {
            background: rgba(255,215,0,0.2);
        }

        .wheel-count-btn.active {
            background: #ffd700;
            color: #1a1a2e;
        }

        .wheels-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            margin: 10px 0;
            position: relative;
        }

        .wheel-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .wheel-select {
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 20px;
            border: 2px solid rgba(245, 166, 35, 0.5);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            outline: none;
            min-width: 180px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .wheel-select option {
            background: #1a1a2e;
            color: #fff;
        }

        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
        }

        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #e94560;
            z-index: 10;
            filter: drop-shadow(0 0 10px rgba(233, 69, 96, 0.8));
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3), 0 0 60px rgba(245, 166, 35, 0.2);
        }

        .result-box {
            width: 380px;
            min-height: 280px;
            background: linear-gradient(180deg, rgba(20,20,40,0.95) 0%, rgba(5,5,20,0.98) 100%);
            border: 3px solid #ffd700;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
        }

        .result-box.winner {
            border-color: #ffd700;
            box-shadow: 
                0 0 30px rgba(255, 215, 0, 0.5),
                0 0 60px rgba(255, 215, 0, 0.2),
                inset 0 0 40px rgba(255, 215, 0, 0.08);
            animation: slotWin 0.5s ease-out;
        }

        @keyframes slotWin {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-box .brand-name {
            font-size: 1.7rem;
            font-weight: 900;
            color: #ffd700;
            text-align: center;
            margin-top: 14px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6), 0 0 10px rgba(255,215,0,0.3);
            letter-spacing: 1px;
        }

        .result-box .brand-category {
            font-size: 0.9rem;
            color: #bbb;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
        }

        .result-logo-wrap {
            width: 280px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #ffffff 0%, #f0f0f0 100%);
            border-radius: 20px;
            padding: 20px;
            border: 4px solid #ffd700;
            box-shadow: 
                0 10px 40px rgba(0,0,0,0.7),
                0 0 25px rgba(255, 215, 0, 0.4),
                inset 0 0 20px rgba(255, 215, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .result-logo-wrap:hover {
            transform: scale(1.06);
            box-shadow: 
                0 14px 50px rgba(0,0,0,0.8),
                0 0 40px rgba(255, 215, 0, 0.6),
                inset 0 0 20px rgba(255, 215, 0, 0.15);
        }

        .result-logo {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            -webkit-user-drag: auto;
            user-select: all;
        }

        .spin-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            padding: 22px 60px;
            font-size: 1.6rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(180deg, #ff4d4d 0%, #c0392b 50%, #8b0000 100%);
            border: 4px solid #ffd700;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            box-shadow: 
                0 0 20px rgba(255, 215, 0, 0.6),
                0 0 40px rgba(255, 77, 77, 0.4),
                0 8px 25px rgba(0,0,0,0.5),
                inset 0 2px 0 rgba(255,255,255,0.3),
                inset 0 -3px 0 rgba(0,0,0,0.3);
            transition: all 0.2s ease;
            animation: btnPulse 2s ease-in-out infinite;
        }

        @keyframes btnPulse {
            0%, 100% { 
                box-shadow: 
                    0 0 20px rgba(255, 215, 0, 0.6),
                    0 0 40px rgba(255, 77, 77, 0.4),
                    0 8px 25px rgba(0,0,0,0.5),
                    inset 0 2px 0 rgba(255,255,255,0.3),
                    inset 0 -3px 0 rgba(0,0,0,0.3);
            }
            50% { 
                box-shadow: 
                    0 0 30px rgba(255, 215, 0, 0.9),
                    0 0 60px rgba(255, 77, 77, 0.6),
                    0 8px 25px rgba(0,0,0,0.5),
                    inset 0 2px 0 rgba(255,255,255,0.3),
                    inset 0 -3px 0 rgba(0,0,0,0.3);
            }
        }

        .spin-btn:hover {
            transform: translate(-50%, -50%) scale(1.08);
            box-shadow: 
                0 0 40px rgba(255, 215, 0, 1),
                0 0 80px rgba(255, 77, 77, 0.7),
                0 10px 30px rgba(0,0,0,0.5),
                inset 0 2px 0 rgba(255,255,255,0.4),
                inset 0 -3px 0 rgba(0,0,0,0.3);
            background: linear-gradient(180deg, #ff6666 0%, #e74c3c 50%, #a00000 100%);
        }

        .spin-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
            box-shadow: 
                0 0 15px rgba(255, 215, 0, 0.5),
                0 0 30px rgba(255, 77, 77, 0.3),
                0 4px 15px rgba(0,0,0,0.5),
                inset 0 3px 5px rgba(0,0,0,0.4);
        }

        .spin-btn:disabled {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: none;
        }

        @media (max-width: 1100px) {
            .wheel-container {
                width: 320px;
                height: 320px;
            }
            .wheel-container canvas {
                width: 320px;
                height: 320px;
            }
            .result-box {
                width: 310px;
            }
        }

        @media (max-width: 850px) {
            .wheels-container {
                flex-direction: column;
                align-items: center;
            }
            h1 { font-size: 1.8rem; }
        }

        /* Dynamic wheel sizing based on count */
        .wheels-container.count-1 .wheel-container {
            width: 550px;
            height: 550px;
        }
        .wheels-container.count-1 .wheel-container canvas {
            width: 550px;
            height: 550px;
        }
        .wheels-container.count-1 .result-box {
            width: 500px;
        }
        .wheels-container.count-1 .result-logo-wrap {
            width: 320px;
            height: 200px;
        }
        .wheels-container.count-1 .brand-name {
            font-size: 2rem;
        }

        .wheels-container.count-2 .wheel-container {
            width: 450px;
            height: 450px;
        }
        .wheels-container.count-2 .wheel-container canvas {
            width: 450px;
            height: 450px;
        }
        .wheels-container.count-2 .result-box {
            width: 420px;
        }
        .wheels-container.count-2 .result-logo-wrap {
            width: 300px;
            height: 190px;
        }

        .wheel-wrapper.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>BRAND ROULETTE</h1>

    <div class="wheel-count-bar">
        <span class="wheel-count-label">WHEELS:</span>
        <button class="wheel-count-btn active" data-count="1" onclick="setWheelCount(1)">1</button>
        <button class="wheel-count-btn" data-count="2" onclick="setWheelCount(2)">2</button>
        <button class="wheel-count-btn" data-count="3" onclick="setWheelCount(3)">3</button>
    </div>

    <div class="wheels-container">
        <button class="spin-btn" id="spinBtn" onclick="spinAll()">SPIN!</button>
        <div class="wheel-wrapper">
            <select class="wheel-select" id="select1"></select>
            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <canvas id="wheel1" width="400" height="400"></canvas>
            </div>
            <div class="result-box" id="result1">
                <div class="brand-name">-</div>
            </div>
        </div>

        <div class="wheel-wrapper">
            <select class="wheel-select" id="select2"></select>
            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <canvas id="wheel2" width="400" height="400"></canvas>
            </div>
            <div class="result-box" id="result2">
                <div class="brand-name">-</div>
            </div>
        </div>

        <div class="wheel-wrapper">
            <select class="wheel-select" id="select3"></select>
            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <canvas id="wheel3" width="400" height="400"></canvas>
            </div>
            <div class="result-box" id="result3">
                <div class="brand-name">-</div>
            </div>
        </div>
    </div>

    <div class="all-results" id="allResults" style="display:none;"></div>

    <script src="brands.js"></script>
    <script src="wheel.js"></script>
    <script>
        const imageCache = {};
        let activeWheelCount = 3;

        // Populate dropdowns then init wheels
        function populateSelects() {
            const selects = ['select1', 'select2', 'select3'];
            const keys = Object.keys(INDUSTRIES);
            keys.sort((a, b) => {
                if (a === "All Brands") return -1;
                if (b === "All Brands") return 1;
                return a.localeCompare(b);
            });
            selects.forEach(id => {
                const sel = document.getElementById(id);
                keys.forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    sel.appendChild(opt);
                });
            });
        }

        function setWheelCount(count) {
            activeWheelCount = count;
            // Update button states
            document.querySelectorAll('.wheel-count-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.count) === count);
            });
            // Show/hide wheels
            const wrappers = document.querySelectorAll('.wheel-wrapper');
            wrappers.forEach((w, i) => {
                w.classList.toggle('hidden', i >= count);
            });
            // Update container class for sizing
            const container = document.querySelector('.wheels-container');
            container.className = 'wheels-container count-' + count;

            // Redraw visible wheels at new size
            if (wheel1) { wheel1.resize(); }
            if (wheel2 && count >= 2) { wheel2.resize(); }
            if (wheel3 && count >= 3) { wheel3.resize(); }
        }

        populateSelects();
        initWheels();
        setWheelCount(3);
    </script>
</body>
</html>
